name: main

on:
  push:
    branches: [main, test-me-*]
    tags: '*'
  pull_request:

jobs:
  main-windows:
    uses: asottile/workflows/.github/workflows/tox.yml@v1.11.1
    with:
      # Include pypy3 + minimum py3 + maximum py3 on Windows
      env: '["pypy3", "py310", "py314"]'
      os: windows-latest
  main-linux:
    uses: asottile/workflows/.github/workflows/tox.yml@v1.11.1
    with:
      env: '["pypy3", "py310", "py311", "py312", "py313", "py314", "py315"]'
      os: ubuntu-latest

